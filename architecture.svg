<svg viewBox="0 0 1850 1440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AeroHarness seven-stage pipeline: semantic analysis, LLM MMIO modeling and a static verification oracle feed two parallel tracks — a P2IM benchmarking/deep-learning validation track, and a Zephyr PL011 harness-synthesis and RL-scheduling case-study track — with two cross-cutting reuse arrows carrying call-graph data and the oracle uncertainty signal directly into Stage 6 and Stage 7.">
<rect x="0" y="0" width="1850" height="1440" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/></marker>
<marker id="xarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8A8A"/></marker>
</defs>
<text x="925.0" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1A1A1A">AeroHarness Pipeline Architecture</text>
<text x="925.0" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4A4A4A">Agentic, oracle-verified synthesis of fuzz drivers for embedded firmware — 7 stages, one shared front end, two downstream tracks</text>
<rect x="545.0" y="98" width="760" height="38" rx="6" fill="#EDEDED" stroke="#999" stroke-width="1.5"/>
<text x="925.0" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">INPUT — Firmware C/C++ source (Zephyr &amp; RIOT OS drivers, P2IM targets)</text>
<line x1="925.0" y1="136" x2="925.0" y2="176" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="937.0" y="156.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#4A4A4A">C source + headers</text>
<rect x="545.0" y="176" width="760" height="110" rx="8" fill="white" stroke="#2E5C8A" stroke-width="2.5"/>
<rect x="545.0" y="176" width="760" height="34" rx="8" fill="#2E5C8A"/>
<rect x="545.0" y="194" width="760" height="16" fill="#2E5C8A"/>
<text x="559.0" y="199" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="white">STAGE 1 — Semantic Analysis</text>
<text x="559.0" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">Real libclang AST parsing: function signatures, call relationships, MMIO</text>
<text x="559.0" y="248" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">accesses, and candidate register-dependency ordering edges (Oct 3 2026).</text>
<text x="1291.0" y="276" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#4A4A4A">stage1_ast_parser.py</text>
<line x1="925.0" y1="286" x2="925.0" y2="326" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="937.0" y="306.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#4A4A4A">AST + call graph + MMIO accesses + ordering edges (JSON)</text>
<rect x="545.0" y="326" width="760" height="110" rx="8" fill="white" stroke="#7A3FA0" stroke-width="2.5"/>
<rect x="545.0" y="326" width="760" height="34" rx="8" fill="#7A3FA0"/>
<rect x="545.0" y="344" width="760" height="16" fill="#7A3FA0"/>
<text x="559.0" y="349" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="white">STAGE 2 — LLM-Proposed MMIO Models</text>
<text x="559.0" y="380" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">Gemini / local Qwen2.5-Coder proposes a Fuzzware-style behavior model</text>
<text x="559.0" y="398" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">per register — Constant, Passthrough, Bitextract, Set, or Identity.</text>
<text x="1291.0" y="426" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#4A4A4A">stage2_llm_synthesizer_multi.py</text>
<line x1="925.0" y1="436" x2="925.0" y2="476" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="937.0" y="456.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#4A4A4A">Proposed register models + reasoning</text>
<rect x="545.0" y="476" width="760" height="120" rx="8" fill="white" stroke="#1B7A5C" stroke-width="2.5"/>
<rect x="545.0" y="476" width="760" height="34" rx="8" fill="#1B7A5C"/>
<rect x="545.0" y="494" width="760" height="16" fill="#1B7A5C"/>
<text x="559.0" y="499" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="white">STAGE 3 — Static Verification Oracle</text>
<text x="559.0" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">Code-pattern checker cross-checks each proposed model against real</text>
<text x="559.0" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">AST usage patterns. Produces a confirmed / disagreement / unconfident</text>
<text x="559.0" y="566" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">verdict per register, plus a per-register uncertainty signal.</text>
<text x="1291.0" y="586" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#4A4A4A">stage3_oracle_multi.py</text>
<line x1="925.0" y1="596" x2="925.0" y2="640" stroke="#333333" stroke-width="2"/>
<line x1="505.0" y1="640" x2="925.0" y2="640" stroke="#333333" stroke-width="2"/>
<line x1="925.0" y1="640" x2="1345.0" y2="640" stroke="#333333" stroke-width="2"/>
<line x1="505.0" y1="640" x2="505.0" y2="690" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="493.0" y="665.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#4A4A4A">Verified models — P2IM targets (STM32, Kinetis)</text>
<line x1="1345.0" y1="640" x2="1345.0" y2="690" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1357.0" y="665.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#4A4A4A">Verified models — Zephyr PL011 (primary case study)</text>
<text x="505.0" y="630" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#B8650F">VALIDATION TRACK</text>
<text x="1345.0" y="630" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#A33B3B">CASE-STUDY TRACK</text>
<rect x="180" y="690" width="650" height="115" rx="8" fill="white" stroke="#B8650F" stroke-width="2.5"/>
<rect x="180" y="690" width="650" height="34" rx="8" fill="#B8650F"/>
<rect x="180" y="708" width="650" height="16" fill="#B8650F"/>
<text x="194" y="713" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="white">STAGE 4 — Dataset Benchmarking</text>
<text x="194" y="744" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">Evaluated against the P2IM benchmark (2 MCU architectures,</text>
<text x="194" y="762" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">5 peripheral types). 83.3% [95% CI 69.4-91.7%] access-level</text>
<text x="194" y="780" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">accuracy vs. P2IM's published ground truth.</text>
<text x="816" y="795" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#4A4A4A">evaluate_accuracy_canonical.py</text>
<line x1="505.0" y1="805" x2="505.0" y2="845" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="493.0" y="825.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#4A4A4A">Labeled dataset: accesses + ground truth</text>
<rect x="180" y="845" width="650" height="125" rx="8" fill="white" stroke="#B8650F" stroke-width="2.5"/>
<rect x="180" y="845" width="650" height="34" rx="8" fill="#B8650F"/>
<rect x="180" y="863" width="650" height="16" fill="#B8650F"/>
<text x="194" y="868" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="white">STAGE 5 — Deep Learning Classifier</text>
<text x="194" y="899" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">Fine-tuned CodeBERT + XGBoost baseline, trained on Stage 4 labels,</text>
<text x="194" y="917" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">vs. majority-class baseline. Honest finding: neither model (54.0%,</text>
<text x="194" y="935" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">45.7%) beats majority guessing (40.4%); zero-shot LLM (83.3%) wins.</text>
<text x="816" y="960" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#4A4A4A">train_codebert.py / train_xgboost.py</text>
<rect x="180" y="995" width="650" height="92" rx="6" fill="#F4F4F4" stroke="#CCCCCC" stroke-width="1.5"/>
<text x="192" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1A1A1A">Validation-track outcome</text>
<text x="192" y="1033" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4A4A4A">Zero-shot LLM reasoning statistically outperforms trained</text>
<text x="192" y="1049" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4A4A4A">deep learning on this task — a real, formally-tested negative</text>
<text x="192" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4A4A4A">result for the DL classifier, not an implementation failure.</text>
<text x="192" y="1081" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4A4A4A">See RESULTS.md "Stage 5".</text>
<rect x="1020" y="690" width="650" height="115" rx="8" fill="white" stroke="#7A3FA0" stroke-width="2.5"/>
<rect x="1020" y="690" width="650" height="34" rx="8" fill="#7A3FA0"/>
<rect x="1020" y="708" width="650" height="16" fill="#7A3FA0"/>
<text x="1034" y="713" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="white">STAGE 6 — Harness Synthesis &amp; Self-Repair</text>
<text x="1034" y="744" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">LLM generates libFuzzer harnesses for 3 PL011 functions + a call-</text>
<text x="1034" y="762" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">graph-guided state-machine dispatcher. Compiler diagnostics feed</text>
<text x="1034" y="780" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">back into the LLM in a bounded repair loop until clean compile.</text>
<text x="1656" y="795" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#4A4A4A">harnesses/*.cpp, fuzz_state_machine.c</text>
<line x1="1345.0" y1="805" x2="1345.0" y2="845" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1357.0" y="825.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#4A4A4A">3 isolated harnesses + dispatcher (binaries)</text>
<rect x="1020" y="845" width="650" height="125" rx="8" fill="white" stroke="#A33B3B" stroke-width="2.5"/>
<rect x="1020" y="845" width="650" height="34" rx="8" fill="#A33B3B"/>
<rect x="1020" y="863" width="650" height="16" fill="#A33B3B"/>
<text x="1034" y="868" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="white">STAGE 7 — RL-Guided Scheduling &amp; Sequencing</text>
<text x="1034" y="899" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">Q-learning / UCB1 / PPO prioritize fuzzing time using Stage 3's</text>
<text x="1034" y="917" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">uncertainty signal (ablation), and separately select dispatcher API</text>
<text x="1034" y="935" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A">sequences (sequencing case study) — both llvm-cov cross-validated.</text>
<text x="1656" y="960" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="11" fill="#4A4A4A">rl_strict_ablation.py, run_llvm_cov.py</text>
<rect x="1020" y="995" width="650" height="92" rx="6" fill="#F4F4F4" stroke="#CCCCCC" stroke-width="1.5"/>
<text x="1032" y="1015" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1A1A1A">Case-study-track outcome</text>
<text x="1032" y="1033" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4A4A4A">Scheduling: real uncertainty signal gives a significant</text>
<text x="1032" y="1049" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4A4A4A">robustness/variance-reduction benefit (F=17.42, p&lt;0.01), not a</text>
<text x="1032" y="1065" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4A4A4A">mean-performance one. Sequencing: honest null result (flat 29-PC</text>
<text x="1032" y="1081" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4A4A4A">coverage ceiling) after an 8-point measurement-artifact audit.</text>
<path d="M 1305.0 231 C 1800 231, 1800 747.5, 1670 747.5" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#xarrow)"/>
<text x="1325.0" y="400" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#8A8A8A">call-graph data reused directly</text>
<text x="1325.0" y="416" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#8A8A8A">(ordering inferred from naming,</text>
<text x="1325.0" y="432" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#8A8A8A">not the call graph itself)</text>
<path d="M 1305.0 536 C 1830 536, 1830 907.5, 1670 907.5" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#xarrow)"/>
<text x="1325.0" y="580" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#8A8A8A">per-register uncertainty signal</text>
<text x="1325.0" y="596" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#8A8A8A">reused as Stage 7 reward input</text>
<text x="180" y="1130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1A1A1A">Legend</text>
<rect x="180" y="1138" width="16" height="16" rx="3" fill="#2E5C8A"/>
<text x="202" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A">Deterministic static analysis</text>
<rect x="460" y="1138" width="16" height="16" rx="3" fill="#7A3FA0"/>
<text x="482" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A">LLM-driven generation</text>
<rect x="740" y="1138" width="16" height="16" rx="3" fill="#1B7A5C"/>
<text x="762" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A">Deterministic verification / oracle</text>
<rect x="1020" y="1138" width="16" height="16" rx="3" fill="#B8650F"/>
<text x="1042" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A">Evaluation / benchmarking</text>
<rect x="1300" y="1138" width="16" height="16" rx="3" fill="#A33B3B"/>
<text x="1322" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A">RL-guided search</text>
<line x1="180" y1="1210" x2="220" y2="1210" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="230" y="1214" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A">Primary pipeline data flow (labeled with the artifact passed)</text>
<line x1="180" y1="1236" x2="220" y2="1236" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#xarrow)"/>
<text x="230" y="1240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A">Cross-cutting reuse of an upstream artifact (not the main data flow)</text>
<line x1="180" y1="1266" x2="1670" y2="1266" stroke="#DDD" stroke-width="1"/>
<text x="180" y="1286" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4A4A4A">Figure: Stages 1-3 form a shared front end (AST parsing, LLM register-model proposal, static verification) that then forks into two tracks.</text>
<text x="180" y="1304" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4A4A4A">The validation track (Stages 4-5) benchmarks the front end's accuracy against the third-party P2IM dataset and tests whether a trained</text>
<text x="180" y="1322" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4A4A4A">classifier can match it. The case-study track (Stages 6-7) applies the same verified models to synthesize working fuzz harnesses for a</text>
<text x="180" y="1340" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4A4A4A">real Zephyr driver and uses RL to guide fuzzing time and input sequencing against them. Two dashed arrows show artifacts reused directly</text>
<text x="180" y="1358" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#4A4A4A">across tracks rather than passed down the main pipeline: Stage 1's call-graph data into Stage 6, and Stage 3's uncertainty signal into Stage 7.</text>
</svg>